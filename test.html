<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }
    .container {
      width: min(720px, 92%);
      margin: 40px auto;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 8px; text-align: center; color: #1d4ed8; }
    .subtitle { margin: 0 0 28px; text-align: center; color: #6b7280; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; font-weight: bold; }
    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font: inherit;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #bfdbfe;
      border-color: #2563eb;
    }
    textarea { min-height: 110px; resize: vertical; }
    .checkbox { display: flex; gap: 10px; align-items: flex-start; font-weight: normal; }
    .checkbox input { width: auto; margin-top: 3px; }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      background: #dcfce7;
      color: #166534;
      text-align: center;
    }
    .note { font-size: 13px; color: #6b7280; }
    @media (max-width: 600px) {
      .container { margin: 20px auto; padding: 20px; }
      .row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Job Application Form</h1>
    <p class="subtitle">Please fill in your details carefully.</p>

    <form id="jobForm">
      <div class="row">
        <div class="field">
          <label for="fullName">Full Name *</label>
          <input id="fullName" name="fullName" type="text" placeholder="Anwar Patel" required>
        </div>
        <div class="field">
          <label for="email">Email Address *</label>
          <input id="email" name="email" type="email" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="phone">Mobile Number *</label>
          <input id="phone" name="phone" type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number" required>
        </div>
        <div class="field">
          <label for="dob">Date of Birth *</label>
          <input id="dob" name="dob" type="date" required>
        </div>
      </div>

      <div class="field">
        <label for="address">Current Address *</label>
        <textarea id="address" name="address" placeholder="Enter your complete address" required></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label for="degree">Highest Qualification *</label>
          <select id="degree" name="degree" required>
            <option value="">Select qualification</option>
            <option>Bachelor of Engineering (BE)</option>
            <option>Bachelor of Technology (BTech)</option>
            <option>Bachelor of Computer Applications (BCA)</option>
            <option>Master's Degree</option>
            <option>Diploma</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="branch">Branch / Specialization *</label>
          <input id="branch" name="branch" type="text" placeholder="Computer Science and Engineering" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="college">College Name *</label>
          <input id="college" name="college" type="text" required>
        </div>
        <div class="field">
          <label for="graduationYear">Graduation Year *</label>
          <input id="graduationYear" name="graduationYear" type="number" min="1990" max="2100" placeholder="2026" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="score">CGPA / Percentage *</label>
          <input id="score" name="score" type="text" placeholder="Example: 8.13 CGPA" required>
        </div>
        <div class="field">
          <label for="backlogs">Active Backlogs *</label>
          <select id="backlogs" name="backlogs" required>
            <option value="">Select</option>
            <option>No</option>
            <option>Yes</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="position">Position Applying For *</label>
        <input id="position" name="position" type="text" placeholder="Example: Software Engineer" required>
      </div>

      <div class="field">
        <label for="skills">Technical Skills *</label>
        <textarea id="skills" name="skills" placeholder="Example: Java, JavaScript, React, Angular, Docker" required></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label for="linkedin">LinkedIn Profile</label>
          <input id="linkedin" name="linkedin" type="url" placeholder="https://linkedin.com/in/username">
        </div>
        <div class="field">
          <label for="github">GitHub Profile</label>
          <input id="github" name="github" type="url" placeholder="https://github.com/username">
        </div>
      </div>

      <div class="field">
        <label for="resume">Upload Resume *</label>
        <input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" required>
        <p class="note">Accepted formats: PDF, DOC and DOCX.</p>
      </div>

      <div class="field">
        <label class="checkbox">
          <input type="checkbox" required>
          <span>I confirm that the information provided is correct. *</span>
        </label>
      </div>

      <button type="submit">Submit Application</button>
      <div id="message">Your application has been submitted successfully!</div>
    </form>
  </main>

  <script>
    const form = document.getElementById('jobForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      message.style.display = 'block';
      message.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  </script>
</body>
</html>
